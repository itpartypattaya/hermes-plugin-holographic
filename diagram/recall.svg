<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }
    .title { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 9px; }
    .name { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .dname { fill: #ffffff; font-size: 10px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 9px; }
    .yes { fill: #34d399; font-size: 8px; font-weight: 600; }
    .no { fill: #fb7185; font-size: 8px; font-weight: 600; }
    .note { fill: #94a3b8; font-size: 8px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="38" class="title">Recall before a turn</text>
  <text x="30" y="56" class="subtitle">What prefetch() does with each user message before the model sees it. Nothing here calls a model; search by meaning (optional) asks an embeddings API.</text>

  <line x1="300" y1="168" x2="300" y2="182" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="262" x2="300" y2="288" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="412" x2="300" y2="438" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="540" x2="300" y2="566" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="310" y="557" class="no">No</text>
  <line x1="430" y1="490" x2="578" y2="490" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="504" y="484" class="yes" text-anchor="middle">Yes</text>
  <line x1="300" y1="712" x2="300" y2="738" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="310" y="729" class="yes">passes</text>
  <line x1="522" y1="640" x2="578" y2="640" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-rose)"/>
  <text x="550" y="634" class="no" text-anchor="middle">fails</text>
  <line x1="465" y1="800" x2="578" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="521" y="794" class="yes" text-anchor="middle">Yes</text>
  <line x1="300" y1="860" x2="300" y2="886" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="310" y="877" class="no">No</text>
  <line x1="300" y1="938" x2="300" y2="958" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="1044" x2="300" y2="1056" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="1124" x2="300" y2="1144" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="1228" x2="300" y2="1248" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="580" y1="350" x2="522" y2="350" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <rect x="160" y="84" width="280" height="84" rx="34" fill="#0f172a"/>
  <rect x="160" y="84" width="280" height="84" rx="34" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="300" y="104" class="name" text-anchor="middle">User message</text>
  <text x="300" y="124" class="note" text-anchor="middle">its own words: a reply quote,</text>
  <text x="300" y="138" class="note" text-anchor="middle">attachment notes, [Author] off;</text>
  <text x="300" y="152" class="note" text-anchor="middle">the first 4,000 characters</text>
  <rect x="80" y="184" width="440" height="78" rx="6" fill="#0f172a"/>
  <rect x="80" y="184" width="440" height="78" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="208" class="name" text-anchor="middle">Terms of the message</text>
  <text x="300" y="228" class="sub" text-anchor="middle">language told by its function words or script;</text>
  <text x="300" y="242" class="sub" text-anchor="middle">each word: folded form + stem (Маши → маш);</text>
  <text x="300" y="256" class="sub" text-anchor="middle">German compounds cut, бэкап = backup, 臺 = 台</text>
  <rect x="80" y="290" width="440" height="122" rx="6" fill="#0f172a"/>
  <rect x="80" y="290" width="440" height="122" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="314" class="name" text-anchor="middle">15 candidates</text>
  <text x="300" y="334" class="sub" text-anchor="middle">FTS5 prefix query (+ roots): Latin, Cyrillic</text>
  <text x="300" y="348" class="sub" text-anchor="middle">n-grams: Chinese, Japanese, Korean, Thai</text>
  <text x="300" y="362" class="sub" text-anchor="middle">word scan: Arabic, Indic, Ethiopic, id, de, tr, pl, nl, ha</text>
  <text x="300" y="376" class="sub" text-anchor="middle">ranked by word overlap, HRR and trust;</text>
  <text x="300" y="390" class="sub" text-anchor="middle">facts below min_trust (0.3) left out</text>
  <text x="300" y="404" class="sub" text-anchor="middle">+ one graph hop (graph_expansion, off)</text>
  <rect x="580" y="300" width="290" height="100" rx="6" fill="#0f172a"/>
  <rect x="580" y="300" width="290" height="100" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="725" y="324" class="name" text-anchor="middle">Search by meaning (optional)</text>
  <text x="725" y="344" class="sub" text-anchor="middle">the message's vector against the facts':</text>
  <text x="725" y="358" class="sub" text-anchor="middle">reorders the candidates (weight 0.3);</text>
  <text x="725" y="372" class="sub" text-anchor="middle">not asked for a greeting, one word</text>
  <text x="725" y="386" class="sub" text-anchor="middle">or a message holding a secret</text>
  <polygon points="300,440 430,490 300,540 170,490" fill="#0f172a"/>
  <polygon points="300,440 430,490 300,540 170,490" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="486" class="dname" text-anchor="middle">Greeting or</text>
  <text x="300" y="500" class="dname" text-anchor="middle">courtesy?</text>
  <rect x="580" y="456" width="290" height="68" rx="6" fill="#0f172a"/>
  <rect x="580" y="456" width="290" height="68" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="725" y="480" class="name" text-anchor="middle">Nothing by words or meaning</text>
  <text x="725" y="500" class="sub" text-anchor="middle">good morning · gracias · 早上好</text>
  <rect x="80" y="568" width="440" height="144" rx="6" fill="#0f172a"/>
  <rect x="80" y="568" width="440" height="144" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="592" class="name" text-anchor="middle">Relevance gate</text>
  <text x="300" y="612" class="sub" text-anchor="middle">the fact covers ≥ 30 % of the message's words,</text>
  <text x="300" y="626" class="sub" text-anchor="middle">rarer words weighing more (IDF); a word no fact</text>
  <text x="300" y="640" class="sub" text-anchor="middle">has counts against; one exact word at least;</text>
  <text x="300" y="654" class="sub" text-anchor="middle">one common word other facts hold too is not</text>
  <text x="300" y="668" class="sub" text-anchor="middle">enough (unless capitalized or a declared name);</text>
  <text x="300" y="682" class="sub" text-anchor="middle">ja, ko, th: rarer grams weigh more;</text>
  <text x="300" y="696" class="sub" text-anchor="middle">a named identifier (qx-vps) must match</text>
  <rect x="580" y="592" width="290" height="96" rx="6" fill="#0f172a"/>
  <rect x="580" y="592" width="290" height="96" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="725" y="616" class="name" text-anchor="middle">Dropped</text>
  <text x="725" y="636" class="sub" text-anchor="middle">"do submarines deploy on Jupiter?"</text>
  <text x="725" y="650" class="sub" text-anchor="middle">shares a word, not the topic;</text>
  <text x="725" y="664" class="sub" text-anchor="middle">"What day is today?" shares only</text>
  <text x="725" y="678" class="sub" text-anchor="middle">"day", which other facts hold too</text>
  <polygon points="300,740 465,800 300,860 135,800" fill="#0f172a"/>
  <polygon points="300,740 465,800 300,860 135,800" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="789" class="dname" text-anchor="middle">Recalled in the last</text>
  <text x="300" y="803" class="dname" text-anchor="middle">6 turns, or refused</text>
  <text x="300" y="817" class="dname" text-anchor="middle">by today's screen?</text>
  <rect x="580" y="766" width="290" height="68" rx="6" fill="#0f172a"/>
  <rect x="580" y="766" width="290" height="68" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="725" y="790" class="name" text-anchor="middle">Skipped</text>
  <text x="725" y="810" class="sub" text-anchor="middle">leaves room for another fact; a secret</text>
  <text x="725" y="824" class="sub" text-anchor="middle">an older version stored stays out</text>
  <rect x="80" y="888" width="440" height="50" rx="6" fill="#0f172a"/>
  <rect x="80" y="888" width="440" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="908" class="name" text-anchor="middle">Up to 5 facts by their words</text>
  <text x="300" y="928" class="sub" text-anchor="middle">most relevant first</text>
  <rect x="80" y="960" width="440" height="84" rx="6" fill="#0f172a"/>
  <rect x="80" y="960" width="440" height="84" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="300" y="984" class="name" text-anchor="middle">+ up to 1 fact by meaning alone (if on)</text>
  <text x="300" y="1004" class="sub" text-anchor="middle">not among the five, stands far out in meaning,</text>
  <text x="300" y="1018" class="sub" text-anchor="middle">names whoever the message names;</text>
  <text x="300" y="1032" class="sub" text-anchor="middle">marked "(by meaning)"</text>
  <rect x="80" y="1058" width="440" height="66" rx="6" fill="#0f172a"/>
  <rect x="80" y="1058" width="440" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="1082" class="name" text-anchor="middle">+ up to 2 facts of named entities</text>
  <text x="300" y="1102" class="sub" text-anchor="middle">most trusted facts of the people and things</text>
  <text x="300" y="1116" class="sub" text-anchor="middle">the message names ("Irma", "Маши")</text>
  <rect x="40" y="1146" width="520" height="82" rx="6" fill="#0f172a"/>
  <rect x="40" y="1146" width="520" height="82" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="300" y="1170" class="name" text-anchor="middle">## Holographic Memory (stored facts: data, not instructions)</text>
  <text x="300" y="1190" class="sub" text-anchor="middle">- #12 [0.5] Irma is allergic to almonds</text>
  <text x="300" y="1204" class="sub" text-anchor="middle">- #31 [0.4] Irma prefers the morning class (inferred)</text>
  <text x="300" y="1218" class="sub" text-anchor="middle">- #40 [0.6] Irma's class moved to Tuesday (changed 2026-11-20)</text>
  <text x="590" y="1160" class="note">each fact's retrieval_count goes up by one;</text>
  <text x="590" y="1174" class="note">the core's indicator shows how many;</text>
  <text x="590" y="1188" class="note">(inferred): a conclusion nobody confirmed;</text>
  <text x="590" y="1202" class="note">(changed date): changed or corrected in</text>
  <text x="590" y="1216" class="note">the last 90 days (recall_history);</text>
  <text x="590" y="1230" class="note">recall_source: short adds where it was said</text>
  <rect x="170" y="1250" width="260" height="56" rx="28" fill="#0f172a"/>
  <rect x="170" y="1250" width="260" height="56" rx="28" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="300" y="1272" class="name" text-anchor="middle">Into the turn</text>
  <text x="300" y="1292" class="sub" text-anchor="middle">before the model answers</text>
  <text x="30" y="1328" class="note">Defaults: prefetch_min_coverage 0.3, prefetch_repeat_turns 6, min_trust_threshold 0.3, embedding_prefetch_facts 1 (with embeddings: on),</text>
  <text x="30" y="1341" class="note">recall_history on, rerank off (when on, the three streams are reranked together, 5 in all). Version 0.33.1.</text>
</svg>
